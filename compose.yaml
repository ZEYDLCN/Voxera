name: voxera

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      VOXERA_ENVIRONMENT: local
      VOXERA_DEBUG: "true"
      VOXERA_DATABASE_URL: postgresql+asyncpg://voxera_app:voxera-app-local@postgres:5432/voxera
      VOXERA_REDIS_URL: redis://redis:6379/0
      VOXERA_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      VOXERA_OBJECT_STORAGE_ACCESS_KEY: voxera
      VOXERA_OBJECT_STORAGE_SECRET_KEY: voxera-local-secret
      VOXERA_OBJECT_STORAGE_BUCKET: voxera-raw
      VOXERA_SECRET_KEY: local-development-key-change-me
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: voxera
      POSTGRES_USER: voxera_admin
      POSTGRES_PASSWORD: voxera-admin-local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxera_admin -d voxera"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: voxera
      MINIO_ROOT_PASSWORD: voxera-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
